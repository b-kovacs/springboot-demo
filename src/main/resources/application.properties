# The REAL runtime configuration - used whenever the app actually runs (locally or in the
# cluster). Contrast with src/test/resources/application.properties, which silently
# overrides the datasource lines below FOR TESTS ONLY (test-classpath resources take
# priority during `mvn test`, main-classpath resources otherwise).
spring.application.name=demo

# ${DB_HOST:localhost} is Spring's placeholder syntax: "use the DB_HOST environment
# variable if it's set, otherwise fall back to localhost." This is what lets the exact
# same jar run unmodified both on a developer's laptop (env var unset -> localhost) and in
# Kubernetes (the Deployment injects DB_HOST=postgres, DB_USER, DB_PASSWORD from a Secret -
# see flux-infra's demo-app.yaml) - no per-environment config file, no rebuild.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/demodb
spring.datasource.username=${DB_USER:demo}
spring.datasource.password=${DB_PASSWORD:demo}

# ddl-auto=update: Hibernate compares its entity mappings (Message.java) against the
# actual database schema on startup and adds any missing tables/columns automatically.
# Convenient for a small demo app; a real production system would typically use "validate"
# (fail startup if the schema doesn't already match) with schema changes managed
# explicitly through a migration tool like Flyway/Liquibase instead - "update" can't
# express a column rename or drop, only additive changes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Without probes.enabled=true, Actuator only exposes one combined /actuator/health
# endpoint. Setting it true makes Spring Boot also expose /actuator/health/liveness and
# /actuator/health/readiness as SEPARATE endpoints - the two states Kubernetes actually
# needs to distinguish (liveness: "restart this container", readiness: "stop sending it
# traffic, but don't restart it") - see the Deployment's readinessProbe/livenessProbe in
# flux-infra for how these get consumed.
management.endpoint.health.probes.enabled=true
# Only "health" and "prometheus" are exposed over HTTP - Actuator has many other endpoints
# (env, beans, threaddump, heapdump...) that reveal internal application details and stay
# OFF by default for good reason; only opt into what's actually needed.
management.endpoints.web.exposure.include=health,prometheus
# show-details=never means the /actuator/health response body is just {"status":"UP"} with
# no breakdown of individual checks (DB connectivity, disk space, etc.) - appropriate for a
# public/unauthenticated endpoint, since a detailed breakdown can leak internal topology
# (e.g. "the database is unreachable" tells an attacker exactly what to target).
management.endpoint.health.show-details=never
# Explicitly turns on the /actuator/prometheus endpoint (in Prometheus's own text
# exposition format, not JSON) - this is the exact URL the ServiceMonitor in
# flux-infra/clusters/kind/observability-config scrapes every 15 seconds.
management.prometheus.metrics.export.enabled=true
