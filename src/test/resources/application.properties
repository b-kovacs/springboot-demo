# TEST-ONLY configuration. Spring Boot resolves properties from the test classpath before
# the main classpath, so every setting here silently overrides the same key in
# src/main/resources/application.properties for any test that boots a Spring context
# (@SpringBootTest, @WebMvcTest, etc.) - the real app never sees this file.
#
# WHY THIS FILE EXISTS: @SpringBootTest (see DemoApplicationTests) boots the full context,
# including the real JPA/datasource configuration, which needs an ACTUAL reachable
# database to construct the Hibernate SessionFactory - there's no Postgres available in
# the CI build environment. Pointing the datasource at an in-memory H2 instance instead
# lets the full context boot and be tested without any external database dependency at
# all. The real app in production still talks to real Postgres - this override is scoped
# to the test JVM only.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# create-drop: build the schema fresh from the JPA entities at context startup, drop it at
# shutdown. Appropriate for a throwaway in-memory test database - never appropriate for a
# real environment with actual data to preserve (see the ddl-auto=update note in the main
# application.properties for the production equivalent, and why even THAT isn't a full
# migration strategy).
spring.jpa.hibernate.ddl-auto=create-drop
